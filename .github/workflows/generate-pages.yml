name: 🏗️ Generate Tool Pages

on:
  push:
    paths:
      - 'data.json'
      - 'compare_data.json'
      - 'templates/**'
      - 'generate.py'
      - 'generate_compare.py'
  workflow_dispatch:

jobs:
  generate:
    name: Generate static tool pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jinja2
        run: pip install jinja2

      - name: Generate tool detail pages + sitemap
        run: python generate.py

      - name: Generate compare pages
        run: python generate_compare.py

      - name: Commit generated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/ category/ compare/ sitemap.xml
          git diff --staged --quiet || \
            git commit -m "chore: regenerate pages (tools + compare) [skip ci]"

      - name: Push changes
        run: git push
