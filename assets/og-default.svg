<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Accent bar -->
  <rect x="80" y="260" width="6" height="110" fill="url(#accent)" rx="3"/>
  <!-- Logo / brand -->
  <text x="80" y="200" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#94a3b8">⚡ AI.Nav</text>
  <!-- Main title -->
  <text x="110" y="300" font-family="system-ui,sans-serif" font-size="64" font-weight="800" fill="#f1f5f9">Open Source</text>
  <text x="110" y="375" font-family="system-ui,sans-serif" font-size="64" font-weight="800" fill="#f1f5f9">AI Tools</text>
  <!-- Gradient text effect via clip -->
  <text x="110" y="440" font-family="system-ui,sans-serif" font-size="28" font-weight="400" fill="#64748b">300+ curated tools · Honest pros, cons &amp; limitations</text>
  <!-- Stats -->
  <text x="110" y="530" font-family="system-ui,sans-serif" font-size="22" fill="#6366f1">yuzec.com</text>
  <!-- Decorative circles -->
  <circle cx="950" cy="315" r="180" fill="none" stroke="#6366f120" stroke-width="60"/>
  <circle cx="1050" cy="200" r="80" fill="none" stroke="#34d39915" stroke-width="40"/>
</svg>
